<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MARKtime - offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #1f2937;
            text-align: center;
            padding: 1.5rem;
        }

        .box {
            max-width: 320px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: .5rem;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 .5rem;
        }

        p {
            font-size: .9rem;
            color: #6b7280;
            margin: 0 0 1.25rem;
        }

        button {
            background: #4338ca;
            color: #fff;
            border: none;
            border-radius: .5rem;
            padding: .6rem 1.25rem;
            font-size: .95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📶</div>
        <h1>Nejsi připojený k internetu</h1>
        <p>Tuhle stránku nejde teď zobrazit. Jakmile se obnoví připojení, zkus to prosím znovu.</p>
        <button onclick="location.reload()">Zkusit znovu</button>
    </div>
</body>
</html>
